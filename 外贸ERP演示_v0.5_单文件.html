<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>光数外贸 ERP 演示</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：左侧导航 + 右侧内容；顶栏为磨砂玻璃，抽屉与弹层为玻璃浮层；浅色＝素白，深色＝墨石 */
:root{
  --bg:#F5F5F7; --side:#FBFBFD; --card:#FFFFFF; --card2:#FAFAFC; --line:#E5E5EA; --line2:#F0F0F3;
  --ink:#1D1D1F; --ink2:#3A3A3C; --muted:#6E6E73; --faint:#8E8E93;
  --accent:#0071E3; --accent-ink:#0060DF; --accent-soft:#E8F1FD; --on-accent:#FFFFFF;
  --ok:#248A3D; --ok-soft:#E9F7EE; --warn:#A65400; --warn-soft:#FFF4E5; --bad:#C7251B; --bad-soft:#FDECEC;
  --yz:#4B49C9; --yz-soft:#EEEDFC; --mute-soft:#F0F0F3;
  --glass:rgba(245,245,247,.74); --glass2:rgba(255,255,255,.82); --scrim:rgba(0,0,0,.18);
  --shadow:0 18px 40px -16px rgba(0,0,0,.22); --shadow-s:0 1px 2px rgba(0,0,0,.06);
  --hover:#F5F8FF; --seg:#E8E8ED; --seg-on:#FFFFFF; --nav-on:#E8E8ED; --nav-hover:#F0F0F3; --input:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
:root[data-skin="dark"]{
  --bg:#141416; --side:#1B1B1E; --card:#1C1C1F; --card2:#202023; --line:#2C2C30; --line2:#242427;
  --ink:#F2F2F4; --ink2:#D1D1D6; --muted:#98989D; --faint:#76767B;
  --accent:#3D6FD1; --accent-ink:#8EB4F2; --accent-soft:#1F2A3C; --on-accent:#FFFFFF;
  --ok:#80C997; --ok-soft:#1C3024; --warn:#DDB16B; --warn-soft:#352B1C; --bad:#EE8C82; --bad-soft:#3A1F1E;
  --yz:#B3B0F7; --yz-soft:#27263D; --mute-soft:#2A2A2D;
  --glass:rgba(20,20,22,.78); --glass2:rgba(34,34,37,.86); --scrim:rgba(0,0,0,.45);
  --shadow:0 18px 40px -16px rgba(0,0,0,.75); --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --hover:#222428; --seg:#2A2A2D; --seg-on:#3A3A3E; --nav-on:#2C2C30; --nav-hover:#232326; --input:#232326;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px;border-radius:6px}

/* ---------- 框架 ---------- */
.app{min-height:100%}
.side{position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px 12px;overflow-y:auto;z-index:20;transition:background .3s}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 16px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;font-family:var(--font-d)}
.brand b{display:block;font-family:var(--font-d);font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--faint);font-size:11px}
.grp{font-size:11px;font-weight:600;color:var(--faint);padding:14px 10px 4px;letter-spacing:.06em}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer;color:var(--ink);transition:background .15s}
.nav:hover{background:var(--nav-hover)}
.nav[aria-current="page"]{background:var(--nav-on);font-weight:600}
.nav[aria-current="page"] .i{stroke:var(--accent-ink)}
.nav .ct{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav .ct.hot{background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;font-weight:600}
.side .foot{margin-top:auto;padding:14px 10px 0;font-size:11px;color:var(--faint);line-height:1.6;border-top:1px solid var(--line);margin-inline:6px}
.i{width:16px;height:16px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mainwrap{min-width:0;display:flex;flex-direction:column;margin-left:236px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:12px;padding:12px max(24px,env(safe-area-inset-right,0px)) 12px 24px;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line);transition:background .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass)}
.crumb{display:flex;gap:6px;align-items:center;color:var(--faint);font-size:12.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.menu{display:none}
.search{position:relative;margin-left:auto;width:min(320px,40vw)}
.search input{width:100%;padding:7px 12px 7px 32px;border-radius:9px;border:1px solid transparent;background:var(--seg);outline:none;transition:border .15s,background .15s}
.search input:focus{background:var(--input);border-color:var(--accent)}
.search .i{position:absolute;left:10px;top:50%;transform:translateY(-50%)}
.results{position:absolute;right:0;left:0;top:calc(100% + 6px);background:var(--glass2);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:grid;gap:2px;max-height:360px;overflow:auto}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--hover)}
.results small{color:var(--faint);margin-left:auto}
.skin{display:flex;padding:2px;border-radius:9px;background:var(--seg)}
.skin button{border:0;background:none;padding:5px 9px;border-radius:7px;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.skin button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);font-weight:600;box-shadow:var(--shadow-s)}
.who{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.main{padding:24px max(24px,env(safe-area-inset-right,0px)) 56px 24px;max-width:1360px;width:100%}
.view{animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 页面元素 ---------- */
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 20px;margin-bottom:20px}
.ph h1{margin:0;font-family:var(--font-d);font-size:30px;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;transition:background .3s,border-color .3s}
.card h3{margin:0 0 12px;font-family:var(--font-d);font-size:15px;font-weight:650;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.card h3 small{font-weight:400;color:var(--faint);font-size:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.g23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.mt{margin-top:14px}
.kpi{display:grid;gap:4px;transition:transform .25s,box-shadow .25s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--font-d);font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;color:var(--faint)}
.kpi .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.card .tbl{border-radius:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:9px 12px;background:var(--card2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
tr.sel td{background:var(--accent-soft)}
td.wrap,.wrap{white-space:normal}
.m{font-family:var(--mono);font-size:12px;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-run{background:var(--accent-soft);color:var(--accent-ink)}.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-mute{background:var(--mute-soft);color:var(--muted)}.p-yz{background:var(--yz-soft);color:var(--yz)}
.tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}
.tag.yz{background:var(--yz-soft);color:var(--yz)}.tag.own{background:var(--mute-soft);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:transform .15s,background .15s,border-color .15s}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.07);background:var(--accent)}
.btn.dng{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn .i{width:14px;height:14px}
.btn.pri .i{stroke:var(--on-accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters{display:inline-flex;flex-wrap:wrap;padding:2px;border-radius:9px;background:var(--seg);gap:2px}
.filters button{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:12.5px;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.filters button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);font-weight:600;box-shadow:var(--shadow-s)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -4px 16px;padding:0 4px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px}
.kv>div{display:grid;gap:2px;min-width:0}
.kv span{font-size:11.5px;color:var(--faint)}
.kv.sep{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.note{color:var(--muted);font-size:12.5px;margin:10px 0 0;line-height:1.65}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:11px;font-size:12.5px;line-height:1.6;margin-bottom:14px}
.banner b{white-space:nowrap}
.banner.own{background:var(--mute-soft)}.banner.yz{background:var(--yz-soft)}.banner.yz b{color:var(--yz)}
.banner.warn{background:var(--warn-soft)}.banner.warn b{color:var(--warn)}.banner.bad{background:var(--bad-soft)}.banner.bad b{color:var(--bad)}
.banner.ok{background:var(--ok-soft)}.banner.ok b{color:var(--ok)}
.stepper{display:flex;gap:0;overflow-x:auto;margin:18px 0 4px;padding-bottom:4px}
.stepper .st{flex:1 0 72px;display:grid;justify-items:center;gap:6px;font-size:11.5px;color:var(--faint);position:relative;text-align:center}
.stepper .st::before{content:"";position:absolute;top:10px;left:-50%;right:50%;height:2px;background:var(--line)}
.stepper .st:first-child::before{display:none}
.stepper .st.done::before,.stepper .st.now::before{background:var(--accent)}
.stepper .dot{width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;position:relative;z-index:1}
.stepper .done .dot{background:var(--accent);border-color:var(--accent)}
.stepper .done .dot .i{stroke:#fff;width:12px;height:12px;stroke-width:2.6}
.stepper .now{color:var(--ink);font-weight:600}
.stepper .now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label,.fb{display:grid;gap:5px;font-size:12px;color:var(--muted)}
input[type=number],input[type=text],input[type=date],select,textarea{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font-size:13px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;line-height:1.6}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.res{display:grid;gap:0}
.res>div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.res>div:last-child{border-bottom:0}
.res .big{font-family:var(--font-d);font-size:18px;font-weight:700}
svg.chart text{font-size:11px;fill:var(--faint);font-family:var(--font)}
.sp{width:88px;height:32px;flex:none}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent-ink);cursor:pointer;padding:0;margin-bottom:12px;font-size:13px}
.back .i{stroke:var(--accent-ink)}

/* 看板 */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px;align-content:start;min-height:200px}
.col h4{margin:2px 4px 2px;font-size:12.5px;display:flex;justify-content:space-between;color:var(--muted)}
.col h4 span{font-variant-numeric:tabular-nums}
.col h4 .tag{margin-left:6px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 11px;display:grid;gap:4px;transition:transform .2s,box-shadow .2s}
.kc:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kc.late{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.kc .t{font-weight:650;font-family:var(--mono);font-size:12px}
.kc .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .f{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:11.5px}

/* 追溯树 */
.trace{display:grid;gap:0}
.tn{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;position:relative;padding:9px 0}
.tn:not(:last-child)::after{content:"";position:absolute;left:13px;top:30px;bottom:-9px;width:2px;background:var(--line)}
.tn .dot{width:14px;height:14px;border-radius:50%;margin-left:6px;position:relative;z-index:1;border:2px solid var(--card)}
.tn .d{background:var(--ok)}.tn .a{background:var(--accent);animation:breathe 2.8s ease-in-out infinite}.tn .w{background:var(--line)}
.tn .lbl b{display:block;font-size:13px}
.tn .lbl span{font-size:12px;color:var(--muted)}
.tn.sub{padding-left:22px}
.tn.sub::after{left:35px}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}

/* 抽屉 */
.layer{position:fixed;inset:0;z-index:40;background:var(--scrim);animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:41;background:var(--glass2);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-left:1px solid var(--line);box-shadow:var(--shadow);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 22px;animation:slide .32s cubic-bezier(.2,.8,.2,1)}
.drawer h2{margin:0;font-family:var(--font-d);font-size:21px;letter-spacing:-.015em}
.drawer h3{font-family:var(--font-d);font-size:14px;margin:22px 0 10px}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}
.x{border:0;background:var(--seg);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
@keyframes slide{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini>div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:grid;gap:2px}
.mini span{font-size:11px;color:var(--faint)}
.mini b{font-family:var(--font-d);font-size:16px;font-variant-numeric:tabular-nums}
.timeline{display:grid;gap:10px}
.timeline>div{display:grid;grid-template-columns:44px 10px minmax(0,1fr);gap:10px;align-items:start;font-size:12.5px}
.timeline .t{color:var(--faint);font-variant-numeric:tabular-nums}
.timeline .d{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px}
.chat{display:grid;gap:8px;background:var(--card2);border-radius:12px;padding:12px;border:1px solid var(--line)}
.bubble{max-width:82%;padding:8px 11px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12.5px}
.bubble.me{justify-self:end;background:var(--accent);border-color:var(--accent);color:#fff}
.bubble small{display:block;font-size:10.5px;opacity:.7;margin-bottom:2px}

/* 需求确认 */
.req-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 12px}
.req-sum div{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center}
.req-sum b{display:block;font-family:var(--font-d);font-size:22px}
.req-sum span{font-size:12px;color:var(--muted)}
.req-prog{height:6px;background:var(--seg);border-radius:99px;overflow:hidden}
.req-prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.req-group{margin-top:28px}
.req-group h2{font-family:var(--font-d);font-size:19px;margin:0 0 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.req-group h2 small{font-size:12.5px;font-weight:400;color:var(--faint)}
.req-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.req{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;display:grid;gap:10px;align-content:start;transition:border-color .2s}
.req[data-c="yes"]{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.req[data-c="no"]{opacity:.7}
.req .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.req .hd b{font-size:14px}
.rec{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}

function table(head, rows, opt = {}) {
  const n = opt.num || [];

}
const head = (t, p, right = '') => `<div class="ph"><div><h1>${t}</h1><p>${p}</p></div>${right}</div>`;
const yzBanner = what => `<div class="banner yz"><b>读自易助</b><span>${what}由易助只读同步，约每 15 分钟更新一次，只取已审核的单据。需要修改请在易助中操作。</span></div>`;
function spark(arr, color) {
  const w = 88, h = 32, max = Math.max(...arr), min = Math.min(...arr), r = max - min || 1;
  const pts = arr.map((v, i) => [i / (arr.length - 1) * (w - 4) + 2, h - 4 - (v - min) / r * (h - 8)]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' '), last = pts[pts.length - 1];
  return `<svg class="sp" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polygon points="2,${h - 2} ${line} ${w - 2},${h - 2}" fill="${color}" opacity=".12"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.6"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5" fill="${color}"/></svg>`;
}
function scStatus(c) {
  if (c.block) return pill('待审批', 'warn');
  const n = NODES[c.type];
  if (c.node >= n.length - 1) return pill('已完成', 'ok');
  if (c.late) return pill(`${n[c.node]} · 逾期 ${c.late} 天`, 'bad');
  return pill(n[c.node], 'run');
}
function stepper(c) {

}
const agingBucket = d => d <= 0 ? '未到期' : d <= 30 ? '1–30 天' : d <= 60 ? '31–60 天' : d <= 90 ? '61–90 天' : d <= 180 ? '91–180 天' : '180 天以上';

V.contract = () => {

  const T = {
    lines: () => table(['客户品号', '内部品号', '品名', '海关编码', '数量', '单价', '金额'], c.lines.map(l => [mono(l[0]), mono(prodOf(l[0]).inner), prodOf(l[0]).name, mono(prodOf(l[0]).hs), fmt(l[1]), fmt(l[2], 2), fmt(l[1] * l[2], 2)]), { num: [4, 5, 6] }) + `<p class="note">客户品号（C91 开头）汇入易助时自动对应内部生产品号（91 开头），生产仍按内部品号排单。</p>`,

    change: () => chg.length ? chg.map(x => `<div class="card" style="margin-bottom:12px;background:var(--card2)"><h3>${x.id} · V${x.ver} <small>${x.date} · ${x.by} · ${x.reason}</small>${x.st === '待审批' ? pill('待审批', 'warn') : pill(x.st, 'ok')}</h3>${table(['项目', '原内容', '变更后'], x.diff.map(d => [d[0], `<span style="text-decoration:line-through;color:var(--faint)">${d[1]}</span>`, `<b>${d[2]}</b>`]))}</div>`).join('') + `<div class="toolbar"><button class="btn pri" type="button" data-act="toast" data-msg="已建立变更单 V${String(c.ver + 1).padStart(3, '0')}（演示）">${ic('plus')}新增变更</button></div><p class="note">审批通过后自动生成易助“订单变更单”，版本号与本系统一致。</p>` : `<p class="note">这张合同还没有变更。</p><div class="toolbar"><button class="btn pri" type="button" data-act="toast" data-msg="已建立变更单 V002（演示）">${ic('plus')}新增变更</button></div>`,
    ship: () => ships.length ? table(['出运', '方式', '路线', '本合同数量', '易助出库单', '单证', '状态'], ships.map(s => [`<button class="btn sm" type="button" data-go="ship|${s.id}">${s.id}</button>`, s.mode, s.route, fmt(s.items.filter(i => i[0] === c.pi).reduce((a, i) => a + i[2], 0)), mono(s.ck), `${Object.values(s.docs).filter(Boolean).length}/5`, pill(s.st, s.st === '待订舱' ? 'run' : 'ok')])) : '<p class="note">还没有出运计划。</p>',
    trace: () => traceTree(c),
    profit: () => `<div class="kv"><div><span>预估利润</span>¥${fmt(c.est)}</div><div><span>实际利润</span>${c.act == null ? '未结案' : '¥' + fmt(c.act)}</div><div><span>合同金额</span>${c.cur} ${fmt(total(c), 2)}</div><div><span>产地证</span>${c.co}</div></div>${c.act != null ? `<p class="note">实际比预估少 ¥${fmt(c.est - c.act)}，主要是汇差：报价按 7.1432，结汇 7.1350。<button class="btn sm" type="button" data-go="profit">看差异拆解</button></p>` : ''}`
  };
  return `<button class="back" type="button" data-go="contracts">${ic('left')}返回合同列表</button>` + `
  <div class="card">
    ${c.block ? `<div class="banner warn"><b>暂停</b><span>${c.block}。<button class="btn sm" type="button" data-go="approvals">去审批</button></span></div>` : ''}
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline">
      <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><span class="m" style="font-size:21px;font-weight:650">${c.pi}</span><button class="btn sm" type="button" data-act="openCust" data-id="${cu.id}">${cu.name}</button>${c.xs ? `<span class="tag yz">易助 ${c.xs}</span>` : ''}${scStatus(c)}</div>
      <div><span style="font-family:var(--font-d);font-size:21px;font-weight:700">${c.cur} ${fmt(total(c), 2)}</span> <span class="note" style="margin:0">${c.term}</span></div>

  </div>

};

/* 订单追溯树：外贸段在本系统，生产到核销读自易助 */
function traceTree(c) {
  const cu = custOf(c.cust), wos = DB.wos.filter(w => c.wo.includes(w.id)), wws = DB.wws.filter(w => w.xs && w.xs === c.xs);
  const recv = c.pay.filter(p => p[3] === '已收').reduce((a, p) => a + p[1], 0);
  const node = (st, t, sub, ref, src, cls = '') => `<div class="tn ${cls}"><span class="dot ${st}"></span><span class="lbl"><b>${t} ${src}</b><span>${sub}</span></span><span class="m" style="color:var(--muted)">${ref}</span></div>`;
  const q = DB.quotes.find(x => x.pi === c.pi);
  return `<div class="trace">
    ${node('d', '报价', q ? `V${q.ver} · 毛利 ${q.margin}%` : '直接下单', q ? q.id : '—', ownTag)}
    ${node('d', 'PI 确认', `${cu.short} · ${c.cur} ${fmt(total(c), 2)}`, c.pi, ownTag)}
    ${node(c.xs ? 'd' : c.block ? 'a' : 'w', '易助订单', c.xs ? `V${String(c.ver).padStart(3, '0')} 已同步` : c.block ? '等待信用额度审批' : '未下单', c.xs || '—', yzTag)}
    ${wos.map(w => node(w.st === '已完工' ? 'd' : w.done > 0 || w.st.startsWith('生产') ? 'a' : 'w', '工单', `${w.item} · ${fmt(w.done)} / ${fmt(w.qty)} · ${w.st}`, w.id, yzTag, 'sub')).join('')}
    ${wws.map(w => node('a', '委外贴片', `${w.sup} · 已送料 ${w.sent} 套 · 预计 ${w.due} 回货`, w.id, yzTag, 'sub')).join('')}
    ${node(c.ck ? 'd' : 'w', '出库', c.ck ? '已出库' : '未出库', c.ck || '—', yzTag)}
    ${node(c.xh ? 'd' : 'w', '销货与发票', c.zp ? `发票 ${c.zp}` : '未开票', c.xh || '—', yzTag)}
    ${node(recv >= total(c) ? 'd' : recv > 0 ? 'a' : 'w', '收款（原币）', `${c.cur} ${fmt(recv, 2)} / ${fmt(total(c), 2)}`, c.pay.some(p => p[3] === '到账待认领') ? '有到账待认领' : '', ownTag)}
  </div><p class="note">“易助”标记的节点由易助只读同步：工单的前置单号就是易助订单号，所以能自动对上这张 PI。</p>`;
}
</script>
<script>

  const list = DB.contracts.filter(c => c.type === '外销');

      const w = DB.wos.filter(x => c.wo.includes(x.id)), d = w.reduce((a, x) => a + x.done, 0), q = w.reduce((a, x) => a + x.qty, 0);

    }).join('') || '<p class="note" style="margin:4px">没有合同</p>'}</div>`; }).join('')}</div>
    <p class="note">生产、质检、出库的进度来自易助工单与出库单；订舱、收款由跟单与财务在本系统更新。</p>`;

V.ship = () => {
  const s = DB.ships.find(x => x.id === S.shipSel) || DB.ships[0];
  const w = s.items.map(i => i[2] * prodOf(i[1]).kg), tw = w.reduce((a, b) => a + b, 0);

  const nDoc = Object.values(s.docs).filter(Boolean).length;

  <div class="banner own"><b>取代现在的做法</b><span>出库单备注手写 PI 号、用聊天软件传报关资料，改成在这里生成并存档，每份单证都连到 PI 与易助出库单。</span></div>` +

V.comm = () => {

function go(spec) {
  const [v, a, t] = String(spec).split('|');

  S.drawer = null; $('side').classList.remove('open');

let skinSaved = null;
try { skinSaved = localStorage.getItem('erp5-skin'); } catch (_) {}
function systemSkin() {
  const t = document.documentElement.dataset.theme;
  if (t === 'dark' || t === 'light') return t;
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applySkin(s) { document.documentElement.dataset.skin = s; }
applySkin(skinSaved || systemSkin());
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!skinSaved) { applySkin(systemSkin()); topbar(); } }); } catch (_) {}
try { new MutationObserver(() => { if (!skinSaved) { const s = systemSkin(); if (document.documentElement.dataset.skin !== s) { applySkin(s); topbar(); } } }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (_) {}

/* ================= 需求确认导出 ================= */
function save() { try { localStorage.setItem('erp5-req', JSON.stringify(S.choice)); localStorage.setItem('erp5-note', JSON.stringify(S.note)); } catch (_) {} }
function exportText() {
  const lines = ['【外贸 ERP 需求确认结果 · v0.5】'];
  REQ.forEach(([g, , items]) => {
    lines.push('', `■ ${g}`);
    items.forEach(([id, name]) => { lines.push(`- ${name}：${CH[S.choice[id]] || '未选'}`); if (S.note[id]) lines.push(`  意见：${S.note[id]}`); });
  });
  if (S.note._all) lines.push('', '■ 其他意见', S.note._all);
  return lines.join('\n');
}

let tt;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; t.style.animation = 'none'; void t.offsetWidth; t.style.animation = ''; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2800); }
function keep(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
let seqQ = 3, seqP = 1;

/* ================= 操作 ================= */
const ACT = {
  toast: el => toast(el.dataset.msg),
  menu: () => $('side').classList.toggle('open'),
  skin: el => { skinSaved = el.dataset.id; try { localStorage.setItem('erp5-skin', skinSaved); } catch (_) {} applySkin(skinSaved); topbar(); },
  close: () => { S.drawer = null; drawer(); },
  openCust: el => { S.drawer = el.dataset.id; drawer(); },
  claimCust: el => { const c = custOf(el.dataset.id); c.pool = '私海'; c.sales = '林晓'; keep(render); toast(`已领取 ${c.short}，归属林晓`); },
  custF: el => { S.custF = el.dataset.id; keep(render); },
  scF: el => { S.scF = el.dataset.id; keep(render); },
  sampleF: el => { S.sampleF = el.dataset.id; keep(render); },
  arF: el => { S.arF = el.dataset.id; keep(render); },
  tab: el => { S.tab = el.dataset.id; keep(render); },
  shipSel: el => { S.shipSel = el.dataset.id; keep(render); },
  recSel: el => { S.recSel = el.dataset.id; S.arg = null; keep(render); },
  traceSel: el => { S.traceSel = el.dataset.id; keep(render); },
  perfRule: el => { S.perfRule = el.dataset.id; keep(render); },
  perfCash: () => { S.perfCash = !S.perfCash; keep(render); },
  apply: () => { ALL.forEach(r => { S.choice[r[0]] = r[2] === 'r2' || r[2] === 'ro' ? 'later' : 'yes'; }); save(); keep(render); toast('已按建议选好，可以再逐项调整'); },
  reset: () => { S.choice = {}; save(); keep(render); toast('已清空选择'); },
  copy: () => { const t = $('exportText'); const done = () => toast('已复制，可以贴到微信或邮件');
    try { navigator.clipboard.writeText(t.value).then(done, () => { t.select(); toast('请按 Ctrl+C 复制已选中的文字'); }); } catch (_) { t.select(); toast('请按 Ctrl+C 复制已选中的文字'); } },
  approve: el => {
    const a = DB.approvals.find(x => x.id === el.dataset.id); a.status = '已核准';
    if (a.ref === 'PI20261009MNO') { const c = scOf(a.ref); delete c.block; c.xs = 'XS20261100075'; c.node = 3; DB.batches.unshift(['IMP-1118-01', '11-18 10:32', '订单', 'PI20261009MNO → XS20261100075', '已汇入']); DB.batches = DB.batches.filter(b => b[0] !== 'IMP-1109-01'); toast('已核准，订单已汇入易助 XS20261100075'); }
    else if (a.ref === 'BG-0013') { const ch = DB.changes.find(x => x.id === 'BG-0013'); ch.st = '已同步易助'; scOf(ch.pi).ver = 2; toast('已核准，易助订单变更单 V002 已建立'); }
    else if (a.ref === 'BJ2026111702') { DB.quotes.find(q => q.id === a.ref).status = '已批准'; toast('已核准，报价可以转 PI'); }
    else toast('已核准');
    keep(render);
  },
  reject: el => { const a = DB.approvals.find(x => x.id === el.dataset.id); a.status = '已退回'; keep(render); toast(`已退回给 ${a.who}`); },
  saveQuote: () => {
    const q = S.q, id = 'BJ20261118' + String(seqQ++).padStart(2, '0'), low = S.calc.rate < 12;
    DB.quotes.unshift({ id, ver: 1, cust: q.cust, prod: q.prod, qty: q.qty, price: +S.calc.price.toFixed(2), margin: +S.calc.rate.toFixed(1), status: low ? '待审批' : '已发客户', att: 0, sales: '林晓' });
    if (low) DB.approvals.unshift({ id: 'AP-4' + (13 + seqQ), type: '报价毛利低于门槛', ref: id, who: '林晓', detail: `毛利 ${fmt(S.calc.rate, 1)}%，门槛 12%`, status: '待审批', step: '第 1 层 · 业务主管', go: 'quote' });
    keep(render); toast(low ? `${id} 已保存并送业务主管审批` : `${id} 已保存`);
  },
  toContract: el => {
    const q = DB.quotes.find(x => x.id === el.dataset.id), cu = custOf(q.cust);
    const pi = 'PI20261118' + cu.short.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase();
    q.status = '已转合同'; q.pi = pi;
    DB.contracts.unshift({ pi, xs: '', cust: q.cust, type: '外销', term: 'FOB 深圳', cur: 'USD', sales: q.sales, lines: [[q.prod, q.qty, q.price]], node: 1, ver: 1, pay: [['订金 30%', +(q.qty * q.price * .3).toFixed(2), '11-25', '未收'], ['出货前 70%', +(q.qty * q.price * .7).toFixed(2), '12-20', '未收']], wo: [], ww: '', ck: '', xh: '', zp: '', est: Math.round(q.qty * q.price * curLock()[1] * q.margin / 100), act: null, co: '—', late: 0, use: '量产' });
    go('contract|' + pi); toast(`已生成 ${pi}，确认后汇入易助`);
  },
  advance: el => {
    const c = scOf(el.dataset.id), n = NODES[c.type];
    if (c.node === 1 && !c.xs) { c.xs = 'XS2026111' + String(80 + seqP++); DB.batches.unshift(['IMP-1118-0' + seqP, '11-18 10:40', '订单', `${c.pi} → ${c.xs}`, '已汇入']); }
    c.node = Math.min(c.node + 1, n.length - 1); c.late = 0;
    keep(render); toast(`${c.pi} 进入「${n[c.node]}」${c.node === 2 ? '，订单已汇入易助 ' + c.xs : ''}`);
  },
  sampleWin: el => { const s = DB.samples.find(x => x.id === el.dataset.id); s.st = '已转订单'; s.note = '测试通过，已建立报价单'; S.q.cust = s.cust; S.q.prod = s.prod; go('quote'); toast(`${custOf(s.cust).short} 测试通过，已带入报价`); },
  genDocs: el => { const s = DB.ships.find(x => x.id === el.dataset.id); Object.keys(s.docs).forEach(k => { s.docs[k] = 1; }); keep(render); toast(`${s.id} 单证已全部生成并存档`); },
  afterNext: el => { const a = DB.after.find(x => x.id === el.dataset.id); a.step = Math.min(a.step + 1, a.steps.length - 1); keep(render); toast(`${a.id} 进入「${a.steps[a.step]}」`); },
  claim: el => {
    const [pi, i] = el.dataset.id.split('|'), c = scOf(pi), r = DB.receipts.find(x => x.id === S.recSel);
    const ack = $('ackPayer');
    if (ack && !ack.checked) { toast('请先确认已取得客户付款委托书'); ack.focus(); return; }
    c.pay[+i][3] = '已收'; r.claimed = `${pi} · ${c.pay[+i][0]}`; r.rate = curLock()[1]; r.yz = '已通知出纳在易助开收款单';
    DB.fx.unsettled += r.amt;
    keep(render); toast(`已认领到 ${pi}，折合 ¥${fmt(r.amt * r.rate, 2)}`);
  },
  dun: el => { const r = DB.ar.find(x => x.zp === el.dataset.id); r.log.unshift(['11-18', custOf(r.cust).ch, '已提醒付款，等待客户回复']); keep(render); toast(`已记录 ${r.zp} 的跟催`); },
  settle: () => {
    const a = Math.min(+$('fx-amt').value || 0, DB.fx.unsettled), rate = +$('fx-rate').value || 0;
    if (!a || !rate) { toast('请填写结汇金额与汇率'); return; }
    DB.fx.hist.unshift(['11-18', a, rate, '本次结汇']); DB.fx.unsettled -= a;
    const diff = a * (rate - curLock()[1]);
    keep(render); toast(`已登记结汇 USD ${fmt(a)}，汇差 ${diff >= 0 ? '+' : '−'}¥${fmt(Math.abs(diff), 2)}`);
  }
};

/* ================= 搜索 ================= */
function searchIndex() {
  return [
    ...DB.contracts.map(c => [c.pi + ' ' + c.xs + ' ' + custOf(c.cust).name, c.pi, `${custOf(c.cust).short}${c.xs ? ' · ' + c.xs : ''}`, 'contract|' + c.pi]),
    ...DB.customers.map(c => [c.name + ' ' + c.short + ' ' + c.yz, c.name, c.country, 'customers|' + c.id]),
    ...DB.quotes.map(q => [q.id + ' ' + custOf(q.cust).name, q.id, '报价单', 'quote']),
    ...DB.wos.map(w => [w.id + ' ' + w.xs, w.id, '易助工单', 'prod']),
    ...DB.samples.map(s => [s.id + ' ' + s.jc + ' ' + custOf(s.cust).name, s.id, '样品', 'samples'])
  ];
}
function search(v) {
  const box = $('results'); if (!box) return;
  const k = v.trim().toLowerCase();
  if (!k) { box.hidden = true; return; }
  const hits = searchIndex().filter(x => x[0].toLowerCase().includes(k)).slice(0, 8);
  box.innerHTML = hits.length ? hits.map(h => `<button type="button" data-go="${h[3]}"><span class="m">${esc(h[1])}</span><small>${esc(h[2])}</small></button>`).join('') : '<div class="note" style="margin:8px 10px">没有找到符合的结果</div>';
  box.hidden = false;
}

/* ================= 事件 ================= */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'), a = e.target.closest('[data-act]'), r = e.target.closest('[data-req]');
  if (r) { S.choice[r.dataset.req] = r.dataset.v; save(); keep(render); return; }
  if (a && a.tagName !== 'INPUT' && ACT[a.dataset.act]) { e.preventDefault(); ACT[a.dataset.act](a); return; }
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  if (!e.target.closest('.search')) { const b = $('results'); if (b) b.hidden = true; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act && ACT[t.dataset.act]) { ACT[t.dataset.act](t); return; }
  if (t.dataset.qs) { S.q[t.dataset.qs] = t.value; if (t.dataset.qs === 'prod') S.q.cost = prodOf(t.value).cost; keep(render); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.note) { S.note[t.dataset.note] = t.value; save(); const ex = $('exportText'); if (ex) ex.value = exportText(); }
  if (t.dataset.q) { const v = parseFloat(t.value); if (!isNaN(v)) { S.q[t.dataset.q] = v; const id = t.id, pos = t.selectionStart; keep(render); const n = $(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} } } }
  if (t.id === 'q') search(t.value);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.drawer) ACT.close(); const b = $('results'); if (b) b.hidden = true; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const q = $('q'); if (q) q.focus(); }
});

const start = (location.hash || '').replace('#', '');
S.view = V[start] ? start : 'dash';
render();
</script>

</html>
